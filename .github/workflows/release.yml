name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG"

  build:
    needs: prepare
    if: always() && needs.prepare.result != 'failure' && needs.prepare.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flag: --mac
          - os: windows-latest
            flag: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Trust the signing certificate
        if: matrix.os == 'macos-latest'
        env:
          CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "MAC_CERT_P12 is not set — refusing to publish a macOS build that cannot auto-update."
            exit 1
          fi
          echo "$CERT_P12" | base64 --decode > /tmp/signing.p12
          openssl pkcs12 -in /tmp/signing.p12 -clcerts -nokeys -out /tmp/signing.pem \
            -passin "pass:$CERT_PASSWORD" -legacy
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain /tmp/signing.pem
          KEYCHAIN=/tmp/build.keychain
          security create-keychain -p runner "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p runner "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security import /tmp/signing.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner "$KEYCHAIN"
          rm -f /tmp/signing.p12 /tmp/signing.pem
          security find-identity -v "$KEYCHAIN"

      - run: npx electron-vite build

      - name: Refuse to ship a macOS build that cannot auto-update
        if: matrix.os == 'macos-latest'
        env:
          FINGERPRINT: 0a15f0539b0f02a8d880e637b0c2744f1f0b5dfb
        run: |
          npx electron-builder --mac --dir
          status=0
          found=0
          for app in dist/mac*/TrapRAM.app; do
            [ -d "$app" ] || continue
            found=1
            echo "== $app"
            codesign --verify --strict --verbose=1 "$app" || status=1
            requirement=$(codesign -d -r- "$app" 2>&1 | sed -n 's/^# designated => //p')
            echo "   $requirement"
            case "$requirement" in
              *"certificate leaf = H\"$FINGERPRINT\""*) ;;
              *)
                echo "   NOT signed with the release certificate — Squirrel.Mac would reject every update."
                status=1
                ;;
            esac
          done
          [ "$found" = 1 ] || { echo "no packaged app to check"; status=1; }
          exit $status

      - run: npx electron-builder ${{ matrix.flag }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: true

  tidy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          for name in $(gh release view "$TAG" --json assets -q '.assets[].name' | grep '\.blockmap$' || true); do
            gh release delete-asset "$TAG" "$name" -y
          done
