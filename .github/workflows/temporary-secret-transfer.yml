name: Temporary encrypted secret transfer

on:
  workflow_dispatch:
    inputs:
      recipient_public_key:
        description: Ephemeral RSA public key (base64 encoded)
        required: true
        type: string

permissions:
  actions: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    env:
      RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
    steps:
      - name: Encrypt secrets for the requesting device
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MAC_CERT_P12"
          test -n "$MAC_CERT_PASSWORD"
          node <<'NODE'
          const {
            createCipheriv,
            publicEncrypt,
            randomBytes,
            constants,
          } = require("node:crypto");
          const { writeFileSync } = require("node:fs");

          const publicKey = Buffer.from(process.env.RECIPIENT_PUBLIC_KEY, "base64").toString("utf8");
          const key = randomBytes(32);
          const encrypt = (value) => {
            const iv = randomBytes(12);
            const cipher = createCipheriv("aes-256-gcm", key, iv);
            const ciphertext = Buffer.concat([cipher.update(value, "utf8"), cipher.final()]);
            return {
              iv: iv.toString("base64"),
              ciphertext: ciphertext.toString("base64"),
              tag: cipher.getAuthTag().toString("base64"),
            };
          };
          const payload = {
            version: 1,
            wrappedKey: publicEncrypt(
              {
                key: publicKey,
                padding: constants.RSA_PKCS1_OAEP_PADDING,
                oaepHash: "sha256",
              },
              key,
            ).toString("base64"),
            values: {
              MAC_CERT_P12: encrypt(process.env.MAC_CERT_P12),
              MAC_CERT_PASSWORD: encrypt(process.env.MAC_CERT_PASSWORD),
            },
          };
          writeFileSync("/tmp/synara-secret-transfer.json", `${JSON.stringify(payload)}\n`, {
            mode: 0o600,
          });
          NODE
          echo "Encrypted transfer payload created."

      - name: Upload encrypted transfer payload
        uses: actions/upload-artifact@v4
        with:
          name: synara-secret-transfer-${{ github.run_id }}
          path: /tmp/synara-secret-transfer.json
          retention-days: 1
